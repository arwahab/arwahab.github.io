<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#7c5cf6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 60) scale(520)">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1460 360) scale(540)">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(9)">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1584" height="396" fill="#070b16"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect width="1584" height="396" fill="url(#glowBlue)"/>
  <rect width="1584" height="396" fill="url(#glowViolet)"/>
  <rect width="1584" height="396" fill="url(#titleGrad)" opacity="0.05"/>

  <!-- route / waypoints motif -->
  <path d="M 30 70 C 140 130 280 230 480 296" fill="none"
        stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <g fill="#93c5fd" opacity="0.9">
    <circle cx="30" cy="70" r="6"/>
    <circle cx="170" cy="130" r="6"/>
    <circle cx="310" cy="205" r="6"/>
    <circle cx="430" cy="266" r="6"/>
    <circle cx="480" cy="296" r="7"/>
  </g>
  <circle cx="480" cy="296" r="22" fill="url(#nodeGlow)"/>
  <path d="M 526 326 l 9 -14 l 5 9 l 9 5 l -9 0 l -5 9 l -9 -9 z" fill="#c084fc" opacity="0.9"/>

  <!-- logo -->
  <g transform="translate(750.6 60) scale(0.18)">
    <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#badge)"/>
    <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#sheen)"/>
    <rect x="26.5" y="26.5" width="459" height="459" rx="103.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="6" stroke-linejoin="round">
      <path d="M 256 103 L 399 186 L 399 351 L 256 433 L 113 351 L 113 186 Z"/>
      <path d="M 256 156 L 353 212 L 353 324 L 256 380 L 159 324 L 159 212 Z"/>
    </g>
    <g fill="#ffffff">
      <circle cx="256" cy="103" r="9" opacity="0.7"/>
      <circle cx="399" cy="186" r="9" opacity="0.7"/>
      <circle cx="399" cy="351" r="9" opacity="0.7"/>
      <circle cx="256" cy="433" r="9" opacity="0.7"/>
      <circle cx="113" cy="351" r="9" opacity="0.7"/>
      <circle cx="113" cy="186" r="9" opacity="0.7"/>
    </g>
    <text x="256" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="172" font-weight="900" fill="#ffffff">WW</text>
  </g>

  <!-- title lockup -->
  <text x="792" y="200" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" fill="#ffffff" letter-spacing="0.5">Wahab Waypoint</text>

  <!-- tagline -->
  <text x="792" y="246" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.3">Evaluate architectural tradeoffs across scalability, reliability, cost &amp; operations.</text>

  <!-- feature chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">
    <g transform="translate(448 282)">
      <rect width="186" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="93" y="23" text-anchor="middle">12 Workload Scenarios</text>
    </g>
    <g transform="translate(654 282)">
      <rect width="156" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="78" y="23" text-anchor="middle">Tradeoff Scoring</text>
    </g>
    <g transform="translate(830 282)">
      <rect width="138" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="69" y="23" text-anchor="middle">ADR Generation</text>
    </g>
    <g transform="translate(988 282)">
      <rect width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="74" y="23" text-anchor="middle">Data Mesh Ready</text>
    </g>
  </g>
</svg>

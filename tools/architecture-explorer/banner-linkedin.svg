<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#7c5cf6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 60) scale(520)">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1460 360) scale(540)">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(9)">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1584" height="396" fill="#070b16"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect width="1584" height="396" fill="url(#glowBlue)"/>
  <rect width="1584" height="396" fill="url(#glowViolet)"/>
  <rect width="1584" height="396" fill="url(#titleGrad)" opacity="0.05"/>

  <!-- route / waypoints motif -->
  <path d="M 700 60 C 900 90 1080 250 1380 320 L 1520 344" fill="none"
        stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <g fill="#93c5fd" opacity="0.9">
    <circle cx="700" cy="60" r="6"/>
    <circle cx="880" cy="120" r="6"/>
    <circle cx="1050" cy="205" r="6"/>
    <circle cx="1220" cy="282" r="6"/>
    <circle cx="1380" cy="320" r="7"/>
  </g>
  <circle cx="1380" cy="320" r="22" fill="url(#nodeGlow)"/>
  <path d="M 1520 344 l 9 -14 l 5 9 l 9 5 l -9 0 l -5 9 l -9 -9 z" fill="#c084fc" opacity="0.9"/>

  <!-- logo -->
  <g transform="translate(90 142) scale(0.23)">
    <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#badge)"/>
    <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#sheen)"/>
    <rect x="26.5" y="26.5" width="459" height="459" rx="103.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M 146 156 L 198 322 L 229 196 L 249 262 L 256 398 L 263 262 L 283 196 L 314 322 L 366 156"
          fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title lockup -->
  <text x="258" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" fill="#ffffff" letter-spacing="0.5">Wahab Waypoint</text>

  <!-- tagline -->
  <text x="258" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#cbd5e1" letter-spacing="0.3">Evaluate architectural tradeoffs across scalability, reliability, cost &amp; operations.</text>

  <!-- feature chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e2e8f0">
    <g transform="translate(258 246)">
      <rect width="220" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="110" y="25" text-anchor="middle">12 Workload Scenarios</text>
    </g>
    <g transform="translate(494 246)">
      <rect width="196" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="98" y="25" text-anchor="middle">Tradeoff Scoring</text>
    </g>
    <g transform="translate(706 246)">
      <rect width="176" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="88" y="25" text-anchor="middle">ADR Generation</text>
    </g>
    <g transform="translate(898 246)">
      <rect width="188" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="94" y="25" text-anchor="middle">Data Mesh Ready</text>
    </g>
  </g>
</svg>

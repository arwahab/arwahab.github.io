<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Wahab Waypoint</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1020;
        color: #e6ebf5;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
          sans-serif;
        text-align: center;
      }
      .card {
        max-width: 34rem;
        padding: 2.5rem;
      }
      h1 {
        font-size: 2.5rem;
        margin: 0 0 0.75rem;
        background: linear-gradient(90deg, #6ee7ff, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: #9aa5bd;
        margin: 0.5rem 0;
      }
      a {
        color: #6ee7ff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code {
        color: #c7d2fe;
        background: #1a2238;
        padding: 0.15rem 0.45rem;
        border-radius: 0.35rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Page not found</h1>
      <p>
        We couldn't find <code><span id="target">this page</span></code
        >.
      </p>
      <p><a href="https://wahab2.com/waypoint/index.html">Back to Wahab Waypoint</a></p>
    </div>

    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "");
        if (
          path &&
          !path.endsWith(".html") &&
          !/\/[^/]+\./.test(path)
        ) {
          location.replace(path + ".html" + location.search + location.hash);
          return;
        }
        document.getElementById("target").textContent =
          path.replace(/^\//, "") || "/";
      })();
    </script>
  </body>
</html>

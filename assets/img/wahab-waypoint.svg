<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#7c5cf6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- soft outer glow -->
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#glow)" opacity="0.4" filter="url(#blur)"/>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>

  <!-- badge -->
  <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#badge)"/>
  <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#sheen)"/>
  <rect x="26.5" y="26.5" width="459" height="459" rx="103.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- W-as-waypoint needle -->
  <path
    d="M 146 156 L 198 322 L 229 196 L 249 262 L 256 398 L 263 262 L 283 196 L 314 322 L 366 156"
    fill="none"
    stroke="#ffffff"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
